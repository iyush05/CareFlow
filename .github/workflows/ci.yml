name: CareFlow checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet build src/CareFlow.Api -c Release
      - run: node --check src/CareFlow.Api/wwwroot/app.js
      - name: Start API and run integration checks
        run: |
          ASPNETCORE_ENVIRONMENT=Development DatabaseProvider=Sqlite ConnectionStrings__Hospital='Data Source=ci.db' ASPNETCORE_URLS=http://localhost:5080 dotnet run --no-build -c Release --project src/CareFlow.Api > /tmp/careflow.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do curl -sf http://localhost:5080/health && break; sleep 2; done
          python3 tests/api_smoke.py
