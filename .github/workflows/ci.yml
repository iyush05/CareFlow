name: CareFlow checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [Sqlite, PostgreSql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careflow_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: careflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet build src/CareFlow.Api -c Release
      - run: node --check src/CareFlow.Api/wwwroot/app.js
      - name: Start API and run integration checks
        env:
          DatabaseProvider: ${{ matrix.provider }}
        run: |
          if [ "$DatabaseProvider" = PostgreSql ]; then
            export ConnectionStrings__Hospital='Host=localhost;Database=careflow_test;Username=careflow_test;Password=local_test_only'
          else
            export ConnectionStrings__Hospital='Data Source=ci.db'
          fi
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5080 dotnet run --no-build -c Release --project src/CareFlow.Api > /tmp/careflow.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do curl -sf http://localhost:5080/health && break; sleep 2; done
          python3 tests/api_smoke.py
      - name: Verify production initialization and sessions across restarts
        if: matrix.provider == 'PostgreSql'
        env:
          PGPASSWORD: local_test_only
          ConnectionStrings__Hospital: Host=localhost;Database=careflow_production_checks;Username=careflow_test;Password=local_test_only
        run: |
          psql -h localhost -U careflow_test -d postgres -c 'CREATE DATABASE careflow_production_checks'
          python3 tests/production_smoke.py
