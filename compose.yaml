services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - hospital-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  careflow:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DatabaseProvider: SqlServer
      ConnectionStrings__Hospital: "Server=sqlserver;Database=CareFlow;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      AI__ApiKey: ${AI_API_KEY:-}
    depends_on:
      sqlserver:
        condition: service_healthy
volumes:
  hospital-sql:
